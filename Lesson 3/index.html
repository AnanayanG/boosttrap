<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container">    
        <h1>Buttons</h1>
    <button> Click Me</button>
    <button class="btn btn-secondary"> Click Me</button>
    <button class="btn btn-warning btn-lg"> Click Me</button>
    <button class="btn btn-info btn-sm"> Click Me</button>
    <button class="btn btn-outline-primary"> Click Me</button>
    <br><br><hr>
    <h1>Badges</h1>
    <button class="btn btn-secondary">
        Inbox <span class="badge text-bg-danger">999+</span>
    </button>
    <button class="btn btn-success position-relative">Notifications
        <span class="position-absolute top-0 start-100 translate-middle badge bg-warning rounded-pill">99+</span>
    </button>
    <br><br><hr>
    <h1>Progress Bar</h1>
    <div class="progress mt-2">
        <div class="progress-bar bg-success" style="width:90%">Nearly Done</div>
    </div>
        <div class="progress mt-2">
        <div class="progress-bar progress-bar-striped bg-info" style="width:50%">Half way there</div>
    </div>
        <div class="progress mt-2">

<div class="progress-bar bg-danger progress-bar-striped progress-bar-animated" style="width:80%">Loading</div>

</div>
</div>

</body>
</html>
